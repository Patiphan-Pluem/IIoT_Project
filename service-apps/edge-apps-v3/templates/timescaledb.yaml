{{- range .Values.edges }}
---
apiVersion: v1
kind: Service
metadata:
  name: db-service-{{ .name }}
  namespace: edge-apps
spec:
  clusterIP: None
  selector:
    app: timescaledb
    edge: {{ .name }}
  ports:
    - port: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb-{{ .name }}
  namespace: edge-apps
spec:
  serviceName: "db-service-{{ .name }}"
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
      edge: {{ .name }}
  template:
    metadata:
      labels:
        app: timescaledb
        edge: {{ .name }}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [ "{{ .name }}" ] 
          - weight: 50
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [ "{{ $.Values.cloud_node_name }}" ]
      containers:
        - name: timescaledb
          image: {{ $.Values.images.timescaledb }}
          env:
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
        - name: wal-g-sidecar
          image: {{ index $.Values.images "wal-g" | quote }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: wal-g-creds
                  key: access-key     
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: wal-g-creds
                  key: secret-key
            - name: WALE_S3_PREFIX
              value: "s3://pmu-backup/{{ .name }}" 
            - name: AWS_ENDPOINT
              value: "http://minio.minio-system.svc.cluster.local:9000"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                wal-g wal-push /var/lib/postgresql/data/pgdata/pg_wal
                sleep 60
              done
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 0.5Gi
{{- end }}