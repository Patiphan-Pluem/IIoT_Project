{{- range .Values.edges }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: timescaledb-{{ .name }}
  namespace: edge-apps
spec:
  instances: 1
  imageName: {{ $.Values.images.timescaledb }}

  storage:
    size: 1Gi
    storageClass: local-path

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: [ {{ .name  }} ]
      - weight: 50
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: [ {{ $.Values.cloud_node_name }} ]

  backup:
    barmanObjectStore:
      destinationPath: s3://pmu-backup/{{ .name }}/
      endpointURL: http://minio.minio-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: wal-g-creds
          key: access-key
        secretAccessKey:
          name: wal-g-creds
          key: secret-key
      wal:
        compression: lz4
      data:
        compression: lz4
        jobs: 2

  postgresql:
    parameters:
      shared_preload_libraries: "timescaledb"

---
apiVersion: v1
kind: Service
metadata:
  name: db-service-{{ .name }}
  namespace: edge-apps
spec:
  selector:
    cnpg.io/cluster: timescaledb-{{ .name }}
    cnpg.io/podRole: instance
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}