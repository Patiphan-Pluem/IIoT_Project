{{- range .Values.edges }}
---
apiVersion: v1
kind: Service
metadata:
  name: db-service-{{ .name }}
  namespace: edge-apps
spec:
  clusterIP: None
  selector:
    app: timescaledb
    edge: {{ .name }}
  ports:
    - port: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb-{{ .name }}
  namespace: edge-apps
spec:
  serviceName: "db-service-{{ .name }}"
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
      edge: {{ .name }}
  template:
    metadata:
      labels:
        app: timescaledb
        edge: {{ .name }}
    spec:
      containers:
        - name: timescaledb
          image: {{ $.Values.images.timescaledb }}
          env:
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 0.5Gi
{{- end }}