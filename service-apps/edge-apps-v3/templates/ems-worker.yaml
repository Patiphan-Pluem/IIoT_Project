{{- range .Values.edges }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-worker-{{ .name }}
  namespace: edge-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-worker
      edge: {{ .name }}
  template:
    metadata:
      labels:
        app: ems-worker
        edge: {{ .name }}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ .name }}
            
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ $.Values.cloud_node_name | quote }}

      containers:
      - name: worker
        image: plubpo/ems-app:v8.12
        command: ["python", "worker.py"]
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m" 
              memory: "500Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: ems-worker-service-{{ .name }}
  namespace: edge-apps 
spec:
  clusterIP: None
  selector:
    app: ems-worker
    edge: {{ .name }}
  ports:
    - protocol: TCP
      port: 8080             
{{- end }}