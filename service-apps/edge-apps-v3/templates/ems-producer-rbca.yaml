apiVersion: v1
kind: ServiceAccount
metadata:
  name: ems-producer-sa
  namespace: edge-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-reader
  namespace: edge-apps
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""] 
  resources: ["endpoints", "pods"] 
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-deployments-binding
  namespace: edge-apps
subjects:
- kind: ServiceAccount
  name: ems-producer-sa
  namespace: edge-apps
roleRef:
  kind: Role
  name: deployment-reader
  apiGroup: rbac.authorization.k8s.io
  