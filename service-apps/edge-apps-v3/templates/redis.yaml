{{- range .Values.edges }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-{{ .name }}
  namespace: edge-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      edge: {{ .name }}
  template:
    metadata:
      labels:
        app: redis
        edge: {{ .name }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ if index $.Values.maintenance_mode .name }}{{ $.Values.cloud_node_name | quote }}{{ else }}{{ .name | quote }}{{ end }}
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-{{ .name }}
  namespace: edge-apps
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

{{- end }}
