{{- range .Values.edges }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-producer-{{ .name }}
  namespace: edge-apps  
spec:
  replicas: 1          
  selector:
    matchLabels:
      app: ems-producer
      edge: {{ .name }}
  template:
    metadata:
      labels:
        app: ems-producer
        edge: {{ .name }}
    spec:
      serviceAccountName: ems-producer-sa
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ .name }}
            
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ $.Values.cloud_node_name | quote }}

      containers:
        - name: producer
          image: plubpo/ems-app:v8.12
          command: ["python", "producer.py"]
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              value: "timescaledb-service-{{ .name }}.edge-apps"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASS
              value: "password"
            - name: DB_NAME
              value: "postgres"
            - name: MANUAL_DATA_COUNT
              value: "0"
            - name: DIVIDER_VALUE
              value: "3"
            - name: WORKER_SERVICE_NAME
              value: "ems-worker-service-{{ .name }}"
            - name: NAMESPACE
              value: "edge-apps"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: ems-producer-service-{{ .name }}
  namespace: edge-apps
  annotations:
    prometheus.io/scrape: "true"    
    prometheus.io/port: "5000"     
    prometheus.io/path: "/metrics" 
  labels:
    app: ems-producer
spec:
  ports:
    - port: 5000
      targetPort: 5000
      name: metrics
  selector:
    app: ems-producer
    edge: {{ .name }}
{{- end }}