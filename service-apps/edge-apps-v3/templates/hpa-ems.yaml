{{- range .Values.edges }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ems-{{ .name }}-hpa
  namespace: edge-apps
spec:
  scaleTargetRef:
    apiVersion: ray.io/v1
    kind: RayCluster
    name: ems-{{ .name }}
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50   
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70   
{{- end }}