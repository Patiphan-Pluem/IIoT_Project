{{- range .Values.edges }}
---
# --- Deployment สำหรับ EMS ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-{{ .name }}
  namespace: edge-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems
      edge: {{ .name }}
  template:
    metadata:
      labels:
        app: ems
        edge: {{ .name }}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [ "{{ .name }}" ]
          - weight: 50
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [ "{{ $.Values.cloud_node_name }}" ]
      containers:
      - name: ems
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        command: ["python", "{{ $.Values.scripts.ems }}"]
        env:
        - name: SIM_MODE        
          value: "loop"
        - name: DB_HOST
          value: "timescaledb-{{ .name }}-rw"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: timescaledb-{{ .name }}-app
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: timescaledb-{{ .name }}-app
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: timescaledb-{{ .name }}-app
              key: dbname
{{- end }}