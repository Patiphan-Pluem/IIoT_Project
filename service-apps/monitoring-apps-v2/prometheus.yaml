---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 25.27.0  
    helm:
      values: |
        deploymentStrategy:
          type: Recreate # เหมาะสำหรับ Prometheus ที่มี 1 replica และใช้ storage

        configmapReload:
            enabled: true
            
        server:
          service:
            type: NodePort
          persistentVolume:
            size: 10Gi  
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true" 

          global:
            scrape_interval: 1s
            scrape_timeout: 1s
          
          # คอนฟิกให้ Prometheus มองเห็น cAdvisor ที่แฝงอยู่ใน Kubelet ของ K3s
          extraScrapeConfigs: |
            - job_name: 'k3s-cadvisor'
              scheme: https
              metrics_path: /metrics/cadvisor
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
            - job_name: 'ems-producer'
              scrape_interval: 5s
              kubernetes_sd_configs:
                - role: endpoints
                  namespaces:
                    names:
                      - edge-apps  
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  regex: ems-producer-service-.*

                - source_labels: [__meta_kubernetes_endpoint_port_number]
                  action: keep
                  regex: "5000"
                
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node

        kube-state-metrics:
          enabled: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"

        prometheus-node-exporter:
          enabled: false

        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
---