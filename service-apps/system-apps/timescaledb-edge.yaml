apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timescaledb-edge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.x 
    helm:
      values: |
        auth:
          postgresPassword: "password"
        
        primary:
          initdb:
            scripts:
              01_init_pmu_table.sql: |
                -- สร้าง Extension เผื่อไว้ (สำคัญสำหรับ Hypertable)
                CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
                
                -- สร้างตารางหลัก
                CREATE TABLE IF NOT EXISTS pmu_measurements (
                    time TIMESTAMPTZ NOT NULL,
                    frequency DOUBLE PRECISION,
                    magnitude DOUBLE PRECISION, angle DOUBLE PRECISION,
                    mag_b DOUBLE PRECISION, ang_b DOUBLE PRECISION,
                    mag_c DOUBLE PRECISION, ang_c DOUBLE PRECISION
                );
                
                -- ทำให้เป็น Hypertable ทันทีที่ Database เกิด
                SELECT create_hypertable('pmu_measurements', 'time', if_not_exists => TRUE);

        podSecurityContext:
          fsGroup: 1001

        image:
          registry: docker.io
          repository: timescale/timescaledb
          tag: 2.11.0-pg14

        primary:
          containerSecurityContext:
            enabled: true
            runAsUser: 1001
          
          extraVolumes:
            - name: postgres-run
              emptyDir: {}

          extraVolumeMounts:
            - name: postgres-run
              mountPath: /var/run/postgresql
            
          nodeSelector:
            node-type: edge
          
          sidecars:
            - name: wal-g
              image: chekkan/wal-g:latest-pg
              command: ["sh", "-c"]

              args:
                - |
                  echo "WAL-G sidecar is starting..."
                  sleep infinity

              securityContext:
                runAsUser: 1001

              env:
                - name: WALG_S3_PREFIX
                  value: "s3://iiot-data/timescaledb-wal"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-keys
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-keys
                      key: secret-key
                - name: AWS_ENDPOINT
                  value: "http://minio.minio-system.svc.cluster.local:9000"
                - name: AWS_REGION
                  value: "us-east-1"
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
                - name: postgres-run
                  mountPath: /var/run/postgresql

        # ตั้งค่า PostgreSQL
        postgresqlConfiguration: |
          archive_mode = on
          archive_command = 'wal-g wal-push %p'
          shared_preload_libraries = 'timescaledb'

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"

        persistence:
          enabled: true
          size: 2Gi 
  destination:
    server: https://kubernetes.default.svc
    namespace: edge-apps 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true