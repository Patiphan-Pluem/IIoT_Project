apiVersion: v1
kind: Namespace
metadata:
  name: ray-system
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kuberay-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://ray-project.github.io/kuberay-helm/' 
    chart: kuberay-operator                                
    targetRevision: 1.1.0                                 
    helm:
      values: |
        installCRDs: true                                 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ray-system                                 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
