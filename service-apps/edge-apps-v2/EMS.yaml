apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-a
  namespace: edge-apps
spec:
  selector:
    matchLabels:
      app: ems
  template:
    metadata:
      labels:
        app: ems
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - edge
                      - cloud
          
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - edge

      topologySpreadConstraints:
        - maxSkew: 1 
          topologyKey: "kubernetes.io/hostname" 
          whenUnsatisfiable: ScheduleAnyway 
          labelSelector:
            matchLabels:
              app: ems

      containers:
        - name: ems
          image: ghcr.io/patiphan-pluem/iiot-project:v11
          imagePullPolicy: IfNotPresent
          command: ["python", "ems_simulator.py"]
          env:
            - name: DB_HOST
              value: "timescaledb-edge-postgresql.edge-apps"
            - name: DB_PASS
              value: "password"
            - name: SIM_MODE        
              value: "loop"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
